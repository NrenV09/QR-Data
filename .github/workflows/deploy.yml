name: Build & Deploy Offline PWA + Single-File HTML to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure main folder assets are synced with public/
        run: |
          mkdir -p public
          for asset in icon.svg apple-touch-icon.png pwa-192x192.png pwa-512x512.png pwa-maskable-512x512.png; do
            if [ -f "$asset" ] && [ ! -f "public/$asset" ]; then
              cp "$asset" "public/$asset"
            elif [ -f "public/$asset" ] && [ ! -f "$asset" ]; then
              cp "public/$asset" "$asset"
            fi
          done

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build single-file offline HTML & PWA bundle via vite.config.ts
        run: npm run build

      - name: Verify 100% offline single-file HTML bundle
        run: |
          test -f dist/index.html
          test -f dist/optilink-standalone.html
          echo "Single-file bundle size: $(wc -c < dist/optilink-standalone.html) bytes"

      - name: Upload standalone single-file HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: optilink-offline-singlefile-html
          path: dist/optilink-standalone.html
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
